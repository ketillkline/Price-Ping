<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
    <body>

    <div class="contanier">
        <h1 id="login-header">Welcome!</h1>
        <div class="errors">
            {% if errors %}
                <{% for error in errors %}
                    <li style="color:red;">⚠️ {{ error }}</li>
                {% endfor %}>
            {% endif %}
        </div><br>
         <form method="POST">
            {% csrf_token %}
            <div class="inputs">
                <input type="text" name="username" placeholder="Username"><br><br>
                <input type="password" name="password" placeholder="Password"><br><br>
            <div class="buttons-group">
                <button type="submit" name="login-button">Login</button>
                <p><a href="/signup/">New here?</a> </p>
                <p><a href="/recovery/">Forgot your password?</a> </p>
            </div>
        </form>
    </div>

    </body>
</html>
